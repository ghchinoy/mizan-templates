apiVersion: mizan.dev/v1alpha1
kind: MetricTemplate
metadata:
  id: calibration/banking77-intent-select
  name: Banking Intent Select, 77-way (BANKING77) [HELD OUT]
  description: >
    HELD OUT for out-of-distribution calibration -- do not tune prompts on this one. 77-way
    single-domain intent routing: the labels are fine-grained and deliberately confusable
    (card_arrival vs card_delivery_estimate, top_up_failed vs pending_top_up), which is the
    opposite failure mode from CLINC's coarse cross-domain routing. The `choices` below are
    the gold label strings VERBATIM, including the capitalised `Refund_not_showing_up` and
    the trailing `?` in `reverted_card_payment?`, so selections compare by exact match.
    Load from mteb/banking77 or legacy-datasets/banking77 -- PolyAI/banking77 is script-only
    and no longer loadable.
  version: 0.1.0
  maintainers:
    - mizan-calibration-team
  license: Apache-2.0
  tags:
    - calibration
    - held-out
    - banking77
    - intent
    - choice
    - text
spec:
  kind: choice
  modalities:
    - text
  choices:
    - activate_my_card
    - age_limit
    - apple_pay_or_google_pay
    - atm_support
    - automatic_top_up
    - balance_not_updated_after_bank_transfer
    - balance_not_updated_after_cheque_or_cash_deposit
    - beneficiary_not_allowed
    - cancel_transfer
    - card_about_to_expire
    - card_acceptance
    - card_arrival
    - card_delivery_estimate
    - card_linking
    - card_not_working
    - card_payment_fee_charged
    - card_payment_not_recognised
    - card_payment_wrong_exchange_rate
    - card_swallowed
    - cash_withdrawal_charge
    - cash_withdrawal_not_recognised
    - change_pin
    - compromised_card
    - contactless_not_working
    - country_support
    - declined_card_payment
    - declined_cash_withdrawal
    - declined_transfer
    - direct_debit_payment_not_recognised
    - disposable_card_limits
    - edit_personal_details
    - exchange_charge
    - exchange_rate
    - exchange_via_app
    - extra_charge_on_statement
    - failed_transfer
    - fiat_currency_support
    - get_disposable_virtual_card
    - get_physical_card
    - getting_spare_card
    - getting_virtual_card
    - lost_or_stolen_card
    - lost_or_stolen_phone
    - order_physical_card
    - passcode_forgotten
    - pending_card_payment
    - pending_cash_withdrawal
    - pending_top_up
    - pending_transfer
    - pin_blocked
    - receiving_money
    - Refund_not_showing_up
    - request_refund
    - reverted_card_payment?
    - supported_cards_and_currencies
    - terminate_account
    - top_up_by_bank_transfer_charge
    - top_up_by_card_charge
    - top_up_by_cash_or_cheque
    - top_up_failed
    - top_up_limits
    - top_up_reverted
    - topping_up_by_card
    - transaction_charged_twice
    - transfer_fee_charged
    - transfer_into_account
    - transfer_not_received_by_recipient
    - transfer_timing
    - unable_to_verify_identity
    - verify_my_identity
    - verify_source_of_funds
    - verify_top_up
    - virtual_card_not_working
    - visa_or_mastercard
    - why_verify_identity
    - wrong_amount_of_cash_received
    - wrong_exchange_rate_for_cash_withdrawal
  inputs:
    - name: query
      modality: text
      required: true
  metricPromptTemplate: |
    Route this online-banking customer query to exactly one intent.

    Every query in this corpus belongs to one of the listed intents -- there is no
    out-of-scope option. The distinctions are deliberately fine: separate the thing the
    customer is asking about (a card, a top-up, a transfer, identity verification) from what
    they want done about it (its status, its fee, why it failed, how to get a new one).

    Query:
    {{query}}
  systemInstruction: |
    Choose the most specific intent that fully covers the query, not the nearest broad one.
    When the customer reports something that has not happened yet versus something that
    failed versus something that is merely pending, those are different intents.
  autorater:
    model: gemini-3.5-flash-lite
