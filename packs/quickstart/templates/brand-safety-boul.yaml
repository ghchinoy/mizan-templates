apiVersion: mizan.dev/v1alpha1
kind: MetricTemplate
metadata:
  id: quickstart/brand-safety-boul
  name: Brand Safety Check
  description: Evaluate whether customer-facing content adheres strictly to brand safety guidelines (true/false).
  version: 1.0.0
  maintainers:
    - mizan-quickstart-team
  license: Apache-2.0
  tags:
    - brand-safety
    - boul
    - text
spec:
  kind: boul
  modalities:
    - text
  inputs:
    - name: text
      modality: text
      required: true
  metricPromptTemplate: "Evaluate if the following text is safe, polite, and free of profanity or offensive claims: {{text}}"
  autorater:
    model: gemini-2.5-flash
