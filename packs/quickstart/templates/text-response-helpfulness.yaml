apiVersion: mizan.dev/v1alpha1
kind: MetricTemplate
metadata:
    id: quickstart/text-response-helpfulness
    name: Text Response Helpfulness
    description: Score a single customer-support reply for helpfulness on an explicit 1-5 scale.
    version: 1.0.0
    maintainers:
        - mizan-quickstart-team
    license: Apache-2.0
    tags:
        - customer-support
        - text
        - pointwise
spec:
    kind: pointwise
    modalities:
        - text
    inputs:
        - name: response
          modality: text
          required: true
    metricPromptTemplate: 'Rate the helpfulness of this customer-support reply on a 1-5 scale, where 1 = unhelpful, evasive, or incorrect and 5 = fully resolves the customer''s issue with clear, correct, actionable steps. Reply: {{response}}'
    autorater:
        model: gemini-2.5-flash
        samplingCount: 4
        flipEnabled: true
