apiVersion: mizan.dev/v1alpha1
kind: MetricTemplate
metadata:
  id: judge-eval/tool-parameter-kv-match
  name: Tool Parameter KV Match
  description: >
    Fraction of reference argument key/value pairs matched by the first predicted call.
  version: 0.1.0
  maintainers:
    - mizan-judge-eval
  license: Apache-2.0
  tags: [judge-eval, computation]
spec:
  kind: computation
  modalities: [text]
  inputs:
    - name: response
      modality: text
      required: true
    - name: reference
      modality: text
      required: true
  native:
    metric: tool_parameter_kv_match
