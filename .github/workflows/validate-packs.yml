# validate-packs — PR gate for template packs in mizan-templates.
#
# This repo has NO Go source, so CI cannot build the validator from its own
# checkout; it OBTAINS a version-pinned `mizan` binary via `go install` and runs
# `mizan pack validate .` (structural -> identity -> semantic -> placeholder ->
# lint; all creds-free, no eval API calls). Path-filtered to packs/** so README
# and docs PRs are unaffected.
#
# Design rationale + alternatives (release-binary, cross-repo reusable workflow):
#   ghchinoy/mizan -> docs/collaboration-design.md §3.7.
#
# ── SETUP (done) ──────────────────────────────────────────────────────────
#  1. ghchinoy/mizan is public, so anonymous `go install` works out of the box
#     including on fork `pull_request` runs (where GitHub withholds secrets).
#     If MIZAN_RO_TOKEN is set (e.g. for a private fork/mirror), it is applied
#     opportunistically; when absent or empty on fork PRs, the step is a no-op.
#  2. MIZAN_VERSION is pinned to a tagged mizan release (v0.1.0+). Bump it here
#     to a newer tag when mizan cuts one — the pin is always explicit, never
#     left resolving off @main.
# ─────────────────────────────────────────────────────────────────────────────

name: validate-packs

on:
  push:
    branches: [main]
    paths:
      - "packs/**"
      - ".github/workflows/validate-packs.yml"
  pull_request:
    paths:
      - "packs/**"
      - ".github/workflows/validate-packs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Pinned to the current tagged mizan release. Bump this when mizan cuts a
  # newer tag.
  MIZAN_VERSION: "v0.4.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Configure module access (optional token for private mirrors)
        env:
          MIZAN_RO_TOKEN: ${{ secrets.MIZAN_RO_TOKEN }}
        run: |
          if [ -n "${MIZAN_RO_TOKEN}" ]; then
            git config --global \
              url."https://x-access-token:${MIZAN_RO_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
            go env -w GOPRIVATE=github.com/ghchinoy/*
          fi

      - name: Install pinned mizan validator
        # Note: the mizan CLI uses a pure-Go SQLite driver, so this installs
        # cgo-free in a stock setup-go runner (no C toolchain required).
        run: go install "github.com/ghchinoy/mizan/cmd/mizan@${MIZAN_VERSION}"

      - name: Validate packs
        run: mizan pack validate .
