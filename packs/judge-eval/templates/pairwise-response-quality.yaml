apiVersion: mizan.dev/v1alpha1
kind: MetricTemplate
metadata:
  id: judge-eval/pairwise-response-quality
  name: Pairwise Response Quality (MT-Bench / RewardBench)
  description: >
    Which of two responses better answers the user? Gold is expert preference (MT-Bench human judgments) or the chosen/rejected label (RewardBench). BASELINE = first response, CANDIDATE = second, TIE when equally good or bad.
  version: 0.1.0
  maintainers:
    - mizan-judge-eval
  license: Apache-2.0
  tags: [judge-eval, pairwise]
spec:
  kind: pairwise
  modalities: [text]
  inputs:
    - name: question
      modality: text
      required: true
    - name: baseline
      modality: text
      required: true
    - name: candidate
      modality: text
      required: true
  metricPromptTemplate: |
    Compare two AI assistant responses to the same user question. Consider helpfulness,
    correctness, relevance, depth and harmlessness (a correct refusal of a harmful request is
    better than compliance). Do not prefer a response for being longer or for its position.

    User question:
    {{question}}

    Response A (baseline):
    {{baseline}}

    Response B (candidate):
    {{candidate}}
  baselineFieldName: baseline
  candidateFieldName: candidate
  autorater:
    model: gemini-3.5-flash-lite
    samplingCount: 1
    flipEnabled: false
