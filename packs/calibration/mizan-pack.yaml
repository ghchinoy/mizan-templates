apiVersion: mizan.dev/v1alpha1
kind: Pack
metadata:
    name: calibration
    version: 0.1.0
    description: Judge templates whose verdicts line up 1:1 with the gold labels of public, human-annotated datasets, so you can measure how well a boul / choice / score judge actually agrees with people before you trust it in a pipeline.
